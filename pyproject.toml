[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-platform"
version = "0.1.0"
description = "Single-host GPU workbench and scheduler"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2,<3", "httpx>=0.27,<1", "aiosqlite>=0.20,<1", "tomli>=2; python_version<'3.11'", "nvidia-ml-py>=12", "dbus-next>=0.2.3,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
gpu-platform = "gpu_platform.cli:main"
gpu-platform-runner = "gpu_platform.runner.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gpu_platform.store" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
