[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-platform-mcp"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = ["gpu-platform-client>=0.3,<0.4", "mcp>=1.12,<2"]

[project.scripts]
gpu-platform-mcp = "gpu_platform_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
