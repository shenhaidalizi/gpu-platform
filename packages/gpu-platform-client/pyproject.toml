[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-platform-client"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
gpu-jobs = "gpu_platform_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
